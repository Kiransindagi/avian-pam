name: Code Quality & Linting

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black isort

      - name: Code Formatting Check (Black & Isort)
        run: |
          black --fast --check src tests scripts
          isort --profile black --check-only src tests scripts

      - name: Lint with Flake8
        run: |
          flake8 src tests scripts --max-line-length=120 --ignore=E203,W503,E501,E402,W293,W291,W605,F401,F841
