[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avian-pam"
version = "1.0.0"
description = "Production-grade Passive Acoustic Monitoring & Avian Population Estimation Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Avian PAM Engineering Team", email = "engineering@avian-pam.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "librosa>=0.9.2",
    "soundfile>=0.10.3",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.2",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pyarrow>=8.0.0",
    "scikit-learn>=1.0.0",
    "catboost>=1.1.0",
    "joblib>=1.1.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.23.0",
    "psutil>=5.9.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black==23.7.0",
    "flake8>=6.0.0",
    "isort>=5.11.0",
    "mypy>=1.0.0",
]

[project.scripts]
avian-pam = "src.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

